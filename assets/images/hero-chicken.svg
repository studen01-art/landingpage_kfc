<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="100%" height="100%">
  <defs>
    <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFC72C" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#E4002B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#E4002B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bucketGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B20020"/>
      <stop offset="25%" stop-color="#E4002B"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#E4002B"/>
      <stop offset="100%" stop-color="#8C0018"/>
    </linearGradient>
    <linearGradient id="crispyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA827"/>
      <stop offset="50%" stop-color="#E07A10"/>
      <stop offset="100%" stop-color="#A54900"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="700" height="500" fill="none"/>
  <!-- Warm Back Glow -->
  <circle cx="360" cy="270" r="220" fill="url(#heroGlow)"/>

  <!-- Platter Shadow -->
  <ellipse cx="360" cy="440" rx="260" ry="35" fill="#000000" opacity="0.25"/>

  <!-- Bucket Base -->
  <g filter="url(#shadow)">
    <!-- Bucket Back/Behind Drumsticks -->
    <path d="M220 220 L480 220 L440 420 L260 420 Z" fill="#C8102E"/>
    <!-- Stripes -->
    <path d="M260 220 L285 220 L280 420 L260 420 Z" fill="#FFFFFF"/>
    <path d="M335 220 L365 220 L360 420 L340 420 Z" fill="#FFFFFF"/>
    <path d="M415 220 L440 220 L420 420 L400 420 Z" fill="#FFFFFF"/>
    <!-- Bucket Rim -->
    <ellipse cx="350" cy="220" rx="130" ry="25" fill="#A00018"/>
    <ellipse cx="350" cy="216" rx="126" ry="22" fill="#58000B"/>
    <!-- KFC Label Plaque -->
    <rect x="290" y="290" width="120" height="60" rx="8" fill="#FFFFFF" stroke="#C8102E" stroke-width="3"/>
    <text x="350" y="333" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" fill="#C8102E" text-anchor="middle" letter-spacing="2">KFC</text>
  </g>

  <!-- Fried Chicken Pieces Overflowing -->
  <!-- Drumstick Left -->
  <g transform="rotate(-25 260 170)" filter="url(#shadow)">
    <path d="M210 160 Q260 90 300 130 Q330 170 290 210 Q240 230 210 160 Z" fill="url(#crispyGold)"/>
    <!-- Crispy flakes texture -->
    <circle cx="250" cy="140" r="7" fill="#FFC72C" opacity="0.8"/>
    <circle cx="280" cy="160" r="5" fill="#FFC72C" opacity="0.7"/>
    <circle cx="260" cy="180" r="6" fill="#8C3B00" opacity="0.6"/>
    <!-- Bone -->
    <path d="M195 185 L180 210 A8 8 0 0 1 165 200 A8 8 0 0 1 175 180 L195 170 Z" fill="#FFF2D6" stroke="#D8C0A0" stroke-width="2"/>
  </g>

  <!-- Drumstick Center (Large Hero Piece) -->
  <g transform="rotate(10 360 140)" filter="url(#shadow)">
    <path d="M300 150 Q360 60 410 120 Q440 180 390 220 Q330 230 300 150 Z" fill="url(#crispyGold)"/>
    <circle cx="350" cy="120" r="9" fill="#FFD15C" opacity="0.9"/>
    <circle cx="380" cy="140" r="7" fill="#FFC72C" opacity="0.8"/>
    <circle cx="340" cy="160" r="8" fill="#8C3B00" opacity="0.6"/>
    <circle cx="370" cy="180" r="6" fill="#FFE29A" opacity="0.8"/>
    <path d="M420 180 L445 205 A9 9 0 0 0 460 195 A9 9 0 0 0 450 175 L430 165 Z" fill="#FFF2D6" stroke="#D8C0A0" stroke-width="2"/>
  </g>

  <!-- Drumstick Right -->
  <g transform="rotate(35 450 170)" filter="url(#shadow)">
    <path d="M400 160 Q450 90 490 140 Q510 190 460 220 Q420 220 400 160 Z" fill="url(#crispyGold)"/>
    <circle cx="440" cy="140" r="7" fill="#FFC72C" opacity="0.8"/>
    <circle cx="465" cy="165" r="8" fill="#8C3B00" opacity="0.6"/>
    <path d="M485 190 L515 210 A8 8 0 0 0 525 195 A8 8 0 0 0 505 180 L490 175 Z" fill="#FFF2D6" stroke="#D8C0A0" stroke-width="2"/>
  </g>

  <!-- Floating Crispy Crunch Sprinkles & Chili -->
  <g fill="#E4002B">
    <path d="M190 100 Q195 80 205 90 Q200 110 190 100 Z"/>
    <path d="M520 110 Q530 95 538 105 Q530 120 520 110 Z"/>
  </g>
  <g fill="#FFA827">
    <circle cx="210" cy="120" r="4"/>
    <circle cx="230" cy="85" r="3"/>
    <circle cx="490" cy="80" r="4"/>
    <circle cx="530" cy="140" r="3"/>
    <circle cx="340" cy="50" r="4"/>
  </g>

  <!-- Fresh Basil/Herb garnish leaf -->
  <path d="M280 190 Q300 160 325 180 Q300 200 280 190 Z" fill="#2E7D32"/>
  <path d="M380 200 Q405 170 425 195 Q400 215 380 200 Z" fill="#43A047"/>

  <!-- Badge "GIÒN TAN" -->
  <g transform="translate(110, 240) rotate(-12)" filter="url(#shadow)">
    <circle cx="50" cy="50" r="48" fill="#FFC72C" stroke="#FFFFFF" stroke-width="4"/>
    <text x="50" y="44" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#C8102E" text-anchor="middle">100%</text>
    <text x="50" y="64" font-family="'Arial Black', sans-serif" font-size="15" font-weight="900" fill="#202124" text-anchor="middle">GIÒN CAY</text>
  </g>
</svg>
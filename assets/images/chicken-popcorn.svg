<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg_chicken-popcorn.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#FCEEE6"/>
    </linearGradient>
    <linearGradient id="grad_chicken-popcorn.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFCA28"/>
      <stop offset="100%" stop-color="#E07A10"/>
    </linearGradient>
    <filter id="fShadow_chicken-popcorn.svg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="500" height="350" rx="16" fill="url(#cardBg_chicken-popcorn.svg)"/>
  <!-- Decorative circular backdrop -->
  <circle cx="250" cy="160" r="125" fill="#E4002B" opacity="0.08"/>
  <circle cx="250" cy="160" r="95" fill="#FFCA28" opacity="0.15"/>
  <ellipse cx="250" cy="275" rx="150" ry="20" fill="#000000" opacity="0.1"/>

  <!-- Illustration depending on item type -->
  <g filter="url(#fShadow_chicken-popcorn.svg)" transform="translate(130, 80)">
    <!-- Golden Fried Chicken Drumstick -->
    <path d="M80 120 Q150 20 210 70 Q245 125 185 170 Q110 185 80 120 Z" fill="#E07A10"/>
    <path d="M95 115 Q150 40 195 80 Q215 120 170 155 Q120 165 95 115 Z" fill="#FFA827"/>
    <circle cx="150" cy="90" r="10" fill="#FFD15C" opacity="0.9"/>
    <circle cx="175" cy="115" r="8" fill="#FFC72C" opacity="0.8"/>
    <circle cx="130" cy="130" r="7" fill="#B35300" opacity="0.6"/>
    <!-- Bone -->
    <path d="M75 135 L40 165 A10 10 0 0 1 25 150 A10 10 0 0 1 40 130 L65 120 Z" fill="#FFF2D6" stroke="#D8C0A0" stroke-width="3"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(25, 25)">
    <rect width="110" height="30" rx="15" fill="#E4002B"/>
    <text x="55" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Gà Rán</text>
  </g>
</svg>
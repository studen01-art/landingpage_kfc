<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg_burger-zinger.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#FCEEE6"/>
    </linearGradient>
    <linearGradient id="grad_burger-zinger.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#E8974D"/>
    </linearGradient>
    <filter id="fShadow_burger-zinger.svg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="500" height="350" rx="16" fill="url(#cardBg_burger-zinger.svg)"/>
  <!-- Decorative circular backdrop -->
  <circle cx="250" cy="160" r="125" fill="#E4002B" opacity="0.08"/>
  <circle cx="250" cy="160" r="95" fill="#FFB74D" opacity="0.15"/>
  <ellipse cx="250" cy="275" rx="150" ry="20" fill="#000000" opacity="0.1"/>

  <!-- Illustration depending on item type -->
  <g filter="url(#fShadow_burger-zinger.svg)" transform="translate(140, 90)">
    <!-- Top Bun -->
    <path d="M20 70 Q110 -5 200 70 Z" fill="#E8974D"/>
    <!-- Sesame Seeds -->
    <ellipse cx="70" cy="40" rx="3" ry="1.5" fill="#FFF2D6"/>
    <ellipse cx="110" cy="30" rx="3" ry="1.5" fill="#FFF2D6"/>
    <ellipse cx="150" cy="45" rx="3" ry="1.5" fill="#FFF2D6"/>
    <!-- Crispy Chicken Fillet -->
    <rect x="15" y="70" width="190" height="22" rx="10" fill="#C25A00"/>
    <!-- Lettuce -->
    <path d="M10 92 Q30 85 55 94 Q80 84 110 93 Q140 85 170 94 Q195 86 210 92 L205 102 L15 102 Z" fill="#43A047"/>
    <!-- Cheese slice -->
    <polygon points="20,102 200,102 180,118 40,118" fill="#FFC72C"/>
    <!-- Bottom Bun -->
    <rect x="25" y="115" width="170" height="30" rx="10" fill="#E8974D"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(25, 25)">
    <rect width="110" height="30" rx="15" fill="#E4002B"/>
    <text x="55" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Burger</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg_rice-roast.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#FCEEE6"/>
    </linearGradient>
    <linearGradient id="grad_rice-roast.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA827"/>
      <stop offset="100%" stop-color="#8D6E63"/>
    </linearGradient>
    <filter id="fShadow_rice-roast.svg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="500" height="350" rx="16" fill="url(#cardBg_rice-roast.svg)"/>
  <!-- Decorative circular backdrop -->
  <circle cx="250" cy="160" r="125" fill="#E4002B" opacity="0.08"/>
  <circle cx="250" cy="160" r="95" fill="#FFA827" opacity="0.15"/>
  <ellipse cx="250" cy="275" rx="150" ry="20" fill="#000000" opacity="0.1"/>

  <!-- Illustration depending on item type -->
  <g filter="url(#fShadow_rice-roast.svg)" transform="translate(125, 95)">
    <!-- Plate -->
    <ellipse cx="125" cy="130" rx="125" ry="40" fill="#ECEFF1"/>
    <ellipse cx="125" cy="125" rx="110" ry="32" fill="#FFFFFF" stroke="#CFD8DC" stroke-width="2"/>
    <!-- Rice Mound -->
    <ellipse cx="90" cy="115" rx="55" ry="25" fill="#FFF9E6"/>
    <!-- Chicken piece on rice -->
    <path d="M120 100 Q160 50 190 85 Q210 115 170 135 Q130 140 120 100 Z" fill="#E07A10"/>
    <circle cx="160" cy="95" r="6" fill="#FFA827"/>
    <!-- Fresh Greens & Tomato slice -->
    <circle cx="70" cy="120" r="14" fill="#E53935"/>
    <ellipse cx="60" cy="110" rx="12" ry="7" fill="#43A047"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(25, 25)">
    <rect width="110" height="30" rx="15" fill="#E4002B"/>
    <text x="55" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Cơm</text>
  </g>
</svg>
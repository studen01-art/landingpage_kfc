<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg_snack-fries.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#FCEEE6"/>
    </linearGradient>
    <linearGradient id="grad_snack-fries.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <filter id="fShadow_snack-fries.svg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="500" height="350" rx="16" fill="url(#cardBg_snack-fries.svg)"/>
  <!-- Decorative circular backdrop -->
  <circle cx="250" cy="160" r="125" fill="#E4002B" opacity="0.08"/>
  <circle cx="250" cy="160" r="95" fill="#FFD54F" opacity="0.15"/>
  <ellipse cx="250" cy="275" rx="150" ry="20" fill="#000000" opacity="0.1"/>

  <!-- Illustration depending on item type -->
  <g filter="url(#fShadow_snack-fries.svg)" transform="translate(150, 85)">
    <!-- Fries packet -->
    <path d="M40 70 L160 70 L145 170 L55 170 Z" fill="#E4002B"/>
    <ellipse cx="100" cy="170" rx="45" ry="10" fill="#A00018"/>
    <!-- Crispy Fries -->
    <rect x="55" y="15" width="12" height="70" rx="3" fill="#FFC72C"/>
    <rect x="72" y="5" width="12" height="80" rx="3" fill="#FFA827"/>
    <rect x="90" y="20" width="12" height="65" rx="3" fill="#FFC72C"/>
    <rect x="108" y="10" width="12" height="75" rx="3" fill="#FFA827"/>
    <rect x="125" y="25" width="12" height="60" rx="3" fill="#FFC72C"/>
    <!-- KFC box logo text -->
    <rect x="75" y="100" width="50" height="30" rx="4" fill="#FFFFFF"/>
    <text x="100" y="122" font-family="'Arial Black', sans-serif" font-size="14" font-weight="bold" fill="#E4002B" text-anchor="middle">KFC</text>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(25, 25)">
    <rect width="110" height="30" rx="15" fill="#E4002B"/>
    <text x="55" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Món Ăn Nhẹ</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg_drink-peach-tea.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#FCEEE6"/>
    </linearGradient>
    <linearGradient id="grad_drink-peach-tea.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <filter id="fShadow_drink-peach-tea.svg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="500" height="350" rx="16" fill="url(#cardBg_drink-peach-tea.svg)"/>
  <!-- Decorative circular backdrop -->
  <circle cx="250" cy="160" r="125" fill="#E4002B" opacity="0.08"/>
  <circle cx="250" cy="160" r="95" fill="#FFB74D" opacity="0.15"/>
  <ellipse cx="250" cy="275" rx="150" ry="20" fill="#000000" opacity="0.1"/>

  <!-- Illustration depending on item type -->
  <g filter="url(#fShadow_drink-peach-tea.svg)" transform="translate(160, 75)">
    <!-- Soda Cup -->
    <path d="M35 50 L145 50 L130 185 L50 185 Z" fill="#004B93"/>
    <ellipse cx="90" cy="50" rx="55" ry="12" fill="#E0E0E0"/>
    <!-- Straw -->
    <path d="M95 50 L115 -5" stroke="#E4002B" stroke-width="7" stroke-linecap="round"/>
    <!-- Cup Graphics -->
    <circle cx="90" cy="115" r="28" fill="#FFFFFF"/>
    <path d="M62 115 A28 28 0 0 1 118 115 Z" fill="#E4002B"/>
    <text x="90" y="165" font-family="'Arial Black', sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle">ICE COLD</text>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(25, 25)">
    <rect width="110" height="30" rx="15" fill="#E4002B"/>
    <text x="55" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Đồ Uống</text>
  </g>
</svg>
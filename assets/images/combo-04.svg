<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg_combo-04.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#FCEEE6"/>
    </linearGradient>
    <linearGradient id="grad_combo-04.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA827"/>
      <stop offset="100%" stop-color="#E07A10"/>
    </linearGradient>
    <filter id="fShadow_combo-04.svg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="500" height="350" rx="16" fill="url(#cardBg_combo-04.svg)"/>
  <!-- Decorative circular backdrop -->
  <circle cx="250" cy="160" r="125" fill="#E4002B" opacity="0.08"/>
  <circle cx="250" cy="160" r="95" fill="#FFA827" opacity="0.15"/>
  <ellipse cx="250" cy="275" rx="150" ry="20" fill="#000000" opacity="0.1"/>

  <!-- Illustration depending on item type -->
  <g filter="url(#fShadow_combo-04.svg)" transform="translate(100, 70)">
    <!-- Bucket -->
    <path d="M80 80 L220 80 L200 200 L100 200 Z" fill="#E4002B"/>
    <path d="M110 80 L130 80 L125 200 L110 200 Z" fill="#FFFFFF"/>
    <path d="M170 80 L190 80 L180 200 L165 200 Z" fill="#FFFFFF"/>
    <ellipse cx="150" cy="80" rx="70" ry="14" fill="#A00018"/>
    <!-- Drumsticks in bucket -->
    <path d="M110 70 Q130 20 160 50 Q170 80 130 90 Z" fill="#FFA827"/>
    <path d="M150 65 Q180 10 205 45 Q210 75 170 85 Z" fill="#E07A10"/>
    <!-- Drink Cup -->
    <path d="M230 110 L275 110 L265 195 L240 195 Z" fill="#1C355E"/>
    <rect x="225" y="105" width="55" height="8" rx="3" fill="#FFFFFF"/>
    <path d="M250 105 L260 60" stroke="#E4002B" stroke-width="4" stroke-linecap="round"/>
    <text x="252" y="160" font-family="'Arial Black', sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">PEPSI</text>
    <!-- Fries Box -->
    <path d="M40 130 L75 130 L70 195 L45 195 Z" fill="#E4002B"/>
    <rect x="43" y="100" width="7" height="35" rx="2" fill="#FFC72C"/>
    <rect x="52" y="90" width="7" height="45" rx="2" fill="#FFC72C"/>
    <rect x="61" y="95" width="7" height="40" rx="2" fill="#FFC72C"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(25, 25)">
    <rect width="110" height="30" rx="15" fill="#E4002B"/>
    <text x="55" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Combo</text>
  </g>
</svg>